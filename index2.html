<script>
const products=[['CF-01','Phin Sữa Đá','Cà phê Phin',39000,'public/PHIN_SUA_DA.png','Cà phê phin đậm vị cùng sữa đặc Ngôi Sao.'],['CF-02','Phin Đen Đá','Cà phê Phin',29000,'public/PHIN_DEN_DA.png','Vị cà phê Robusta-Arabica mạnh mẽ.'],['TEA-01','Trà Sen Vàng','Trà quả / Trà sữa',49000,'public/TRA_SEN_VANG.png','Trà sen, hạt sen và củ năng giòn.'],['FRZ-01','Freeze Trà Xanh','Freeze',59000,'public/FREEZE_TRA_XANH.png','Trà xanh xay mát lạnh phủ kem cheese.'],['FRZ-02','Freeze Cà Phê','Freeze',59000,'public/FREEZE_CHOCOLATE.png','Cà phê xay cùng sữa và đá tuyết mịn.'],['FOOD-01','Bánh Mì Que Pate','Bánh & Đồ ăn nhẹ',25000,'public/BANH_MI_QUE.png','Bánh mì que giòn, pate thơm béo.'],['TEA-02','Trà Đào Cam Sả','Trà quả / Trà sữa',45000,'public/TRA_DAO_CAM_SA.png','Trà đào, cam tươi và hương sả thanh nhẹ.'],['LTO-01','Bạc Xỉu Đá','Món mới',45000,'public/BAC_SIU.png','Sữa tươi dịu ngọt cùng lớp cà phê phin.']];
const orders=[{id:'#HD-30658-1048',channel:'Tại bàn',status:'pending',age:1,items:[['Phin Sữa Đá','Size M · 70% đá',2],['Bánh Mì Que Pate','Nóng giòn',1]]},{id:'#HD-30658-1049',channel:'GrabFood',status:'pending',age:2,items:[['Trà Sen Vàng','Size L · Ít ngọt, nhiều hạt sen',1]]},{id:'#HD-30658-1044',channel:'Mang về',status:'brewing',age:3,items:[['Freeze Trà Xanh','Size M · Kem cheese',1],['Phin Đen Đá','Size M · 100% đá',1]]},{id:'#HD-30658-1045',channel:'ShopeeFood',status:'brewing',age:5,items:[['Trà Sen Vàng','Size M · Ít ngọt, nhiều củ năng',2]]},{id:'#HD-30658-1041',channel:'Tại bàn',status:'ready',age:6,items:[['Phin Sữa Đá','Size S · 70% đá',1],['Trà Đào Cam Sả','Size L · 100% ngọt',1]]}];

let cart=[],page='home',menuCat='Tất cả',query='';const money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';
function go(next){page=next;render();scrollTo(0,0)}function render(){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));const a=document.getElementById('app');a.innerHTML=page==='home'?home():page==='products'?menu():page==='promos'?promos():page==='expo'?expo():inventory()}
function home(){return `<main class="page"><section class="hero"><span class="eyebrow">Câu chuyện từ hạt cà phê Việt</span><h1>Đậm vị quen,<br><span>trọn khoảnh khắc.</span></h1><p>Một ly cà phê ngon mở đầu cho những cuộc gặp đáng nhớ. Ghé Highlands Samsora Premier hôm nay.</p><button class="primary" onclick="go('products')">Khám phá menu →</button><button class="secondary" onclick="toast('Câu chuyện Highlands Coffee')">▶ Câu chuyện Highlands</button></section><section class="section"><div class="sectionhead"><div><span class="eyebrow">Hôm nay uống gì?</span><h2>Chọn theo tâm trạng</h2></div></div><div class="grid4">${[['☕','Cà phê Phin','Đậm đà'],['🌼','Trà Sen Vàng','Thanh mát'],['🥤','Freeze','Mát lạnh'],['🥖','Bánh & PhinDi','Ăn nhẹ']].map(x=>`<button class="cat" onclick="go('products')"><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div></section><section class="section"><div class="sectionhead"><div><span class="eyebrow">Được yêu thích</span><h2>Bestseller tại quán</h2></div><button class="filter" onclick="go('products')">Xem menu →</button></div><div class="grid4">${products.slice(0,4).map(card).join('')}</div></section><section class="outlet"><div><span class="eyebrow">Ghé thăm chúng tôi</span><h2>Samsora Premier - Chu Văn An</h2><p>📍 Tầng 1, Samsora Premier, Chu Văn An, Hà Đông, Hà Nội</p><span class="pill">◷ 07:00 - 23:00</span><span class="pill">☎ 1800 6936</span></div><div class="map">📍<br>Samsora Premier<br>Chu Văn An<br><button class="primary" onclick="toast('Đang mở chỉ đường...')">Chỉ đường</button></div></section></main><footer class="footer">HIGHLANDS COFFEE · Outlet HC30658 · Hotline 1800 6936</footer>`}
function card(p){return `<article class="product"><div class="productart"><img src="${p[4]}" alt="${p[1]}" style="width:100%;height:100%;object-fit:contain;padding:10px"></div><div class="productbody"><small>${p[0]}</small><h3>${p[1]} <span class="price" style="float:right;font:700 13px Arial">${money(p[3])}</span></h3><p>${p[5]}</p><button class="choose" onclick="customize('${p[0]}')">＋ Chọn món</button></div></article>`}
function menu(){let list=products.filter(p=>(menuCat==='Tất cả'||p[2]===menuCat)&&p[1].toLowerCase().includes(query.toLowerCase()));let cats=['Tất cả','Cà phê Phin','Freeze','Trà quả / Trà sữa','Bánh & Đồ ăn nhẹ','Món mới'];return `<main class="page"><span class="eyebrow">Menu tại HC30658</span><h1 class="display" style="font-size:42px;margin:6px 0">Thực đơn Highlands</h1><p style="color:var(--muted)">Tươi mới mỗi ngày tại Samsora Premier - Chu Văn An</p><div class="filters">${cats.map(c=>`<button class="filter ${menuCat===c?'active':''}" onclick="menuCat='${c}';render()">${c}</button>`).join('')}</div><div class="toolbar"><input class="search" placeholder="⌕  Tìm món..." value="${query}" oninput="query=this.value;render()"><button class="sort" onclick="products.sort((a,b)=>a[3]-b[3]);render()">⇅ Giá tăng dần</button></div><div class="grid4" style="margin-top:22px">${list.map(card).join('')}</div></main>`}
function customize(id){const p=products.find(x=>x[0]===id);document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><button class="modalclose" onclick="closeModal()">×</button><h2>Tùy chỉnh ${p[1]}</h2><div style="background:var(--cream);padding:15px;border-radius:10px"><img src="${p[4]}" alt="${p[1]}" style="width:64px;height:64px;object-fit:contain;vertical-align:middle"> <b>${p[1]}</b><span class="price" style="float:right">${money(p[3])}</span></div><label>Chọn size<select id="size"><option value="0">Size S (Chuẩn)</option><option value="6000">Size M (+6.000đ)</option><option value="10000">Size L (+10.000đ)</option></select></label><label>Topping<select id="top"><option value="0">Không topping</option><option value="5000">Thạch sen (+5.000đ)</option><option value="5000">Hạt sen (+5.000đ)</option><option value="5000">Kem cheese (+5.000đ)</option></select></label><label>Tỷ lệ đá<select><option>100%</option><option selected>70%</option><option>30%</option><option>Không đá</option></select></label><label>Tỷ lệ ngọt<select><option>100%</option><option>70%</option><option>Ít ngọt</option></select></label><button class="primary" style="width:100%;margin-top:8px" onclick="addCart('${p[0]}')">Thêm vào giỏ</button></div></div>`}
function addCart(id){const p=products.find(x=>x[0]===id),total=p[3]+Number(document.getElementById('size').value)+Number(document.getElementById('top').value);cart.push({p,total});closeModal();updateCart();toast('Đã thêm '+p[1]+' vào giỏ hàng')}
function openCart(){document.getElementById('modalRoot').innerHTML=`<aside class="cart"><button class="modalclose" onclick="closeModal()">×</button><h2>Giỏ hàng</h2>${cart.length?cart.map(x=>`<div class="cartitem">${x.p[4]} <b>${x.p[1]}</b><span style="float:right;color:var(--red)">${money(x.total)}</span></div>`).join(''):'<p style="color:var(--muted);padding:50px 0;text-align:center">Giỏ hàng đang trống</p>'}<hr><p><b>Tạm tính</b><b style="float:right;color:var(--red)">${money(cart.reduce((s,x)=>s+x.total,0))}</b></p><button class="primary" style="width:100%" onclick="cart=[];updateCart();closeModal();toast('Đơn hàng đã được gửi sang quầy POS')">Gửi đơn sang quầy POS</button></aside>`}
function promos(){return `<main class="page"><span class="eyebrow">Đặc quyền dành cho bạn</span><h1 class="display" style="font-size:42px;margin:6px 0">Ưu đãi & Rewards</h1><section class="promohero" style="margin-top:28px"><div><span class="eyebrow">Combo tuần này</span><h1>Mua 2 tặng 1<br>cho cuộc vui thêm trọn.</h1><p>Áp dụng tại Samsora Premier trong khung giờ 14h - 17h.</p><button class="primary">Xem chi tiết →</button></div><div style="background:var(--cream);color:var(--darkred);border-radius:12px;padding:20px"><span class="eyebrow">Happy Hour</span><h2 class="display">14:00 - 17:00</h2><p>Giảm 15% đồ uống size M mỗi ngày.</p></div></section><section class="section"><span class="eyebrow">Kho của bạn</span><h2 class="display">E-Vouchers</h2><div class="vouchergrid">${vouchers.map(v=>`<article class="voucher"><div class="partner">${v[0]}</div><div class="voucherbody"><b>${v[1]}</b><p>Hạn dùng: 30/09/2026</p><span style="font:12px monospace;border:1px dashed #bbb;padding:7px">${v[2]}</span><button class="copy" style="float:right" onclick="copyCode('${v[2]}')">⌘ Lấy mã</button></div></article>`).join('')}</div></section><section class="rewards"><span class="eyebrow">♛ Highlands Rewards</span><h2 class="display">Bạn đang ở hạng Đồng</h2><p style="color:#ffffff99">Tích thêm 320 điểm để lên hạng Bạc.</p><div class="bar"><i></i></div><small style="color:#ffffff88">680 điểm tích lũy năm 2026 · 100 điểm = Voucher 10.000đ</small></section></main>`}
function expo(){return `<main class="office"><div class="page"><span class="eyebrow">Back-office · Quầy EXPO</span><h1 class="display" style="font-size:38px">Điều phối món ra quầy</h1><p style="color:#ffffff88">HC30658 · Samsora Premier - Chu Văn An · Ca sáng 07:00 - 15:00</p><div class="stats"><div class="stat"><small>Đang chờ</small><strong>${orders.length} đơn</strong></div><div class="stat"><small>Thời gian trung bình</small><strong style="color:var(--green)">3:42</strong></div><div class="stat"><small>Mục tiêu</small><strong>&lt; 4 phút</strong></div><div class="stat"><small>Trạng thái</small><strong style="color:var(--green)">Đang mở</strong></div></div><div class="kanban">${[['pending','🔔 Mới nhận'],['brewing','◷ Đang pha chế'],['ready','✓ Sẵn sàng tại EXPO']].map(c=>`<section class="column"><h3>${c[1]} <span style="float:right;color:#ffffff88">${orders.filter(o=>o.status===c[0]).length}</span></h3>${orders.filter(o=>o.status===c[0]).map(ticket).join('')}</section>`).join('')}</div></div></main>`}
function ticket(o){return `<article class="ticket"><div class="tickettop"><span>${o.id}</span><span style="color:${o.age>5?'var(--red)':'var(--amber)'}">◷ ${o.age} phút</span></div><span class="channel">${o.channel}</span><ul>${o.items.map(i=>`<li><b>${i[2]}x ${i[0]}</b><span>${i[1]}</span></li>`).join('')}</ul><button class="advance" onclick="advance('${o.id}')">${o.status==='pending'?'→ Bắt đầu pha':o.status==='brewing'?'→ Báo sẵn sàng':'✓ Báo rung / Gọi khách'}</button></article>`}
function advance(id){const o=orders.find(x=>x.id===id);o.status=o.status==='pending'?'brewing':o.status==='brewing'?'ready':'done';if(o.status==='done')orders.splice(orders.indexOf(o),1);toast(id+' đã cập nhật trạng thái');render()}
function inventory(){return `<main class="inventory"><div class="page"><span class="eyebrow">Back-office · Outlet HC30658</span><h1 class="display" style="font-size:42px;margin:6px 0">Hàng hóa & kho</h1><p style="color:var(--muted)">Theo dõi tồn kho theo ca · 21/09/2026</p><div class="stats"><div class="stat"><small>Giá trị tồn kho</small><strong>${money(12980000)}</strong></div><div class="stat"><small>Sắp hết định mức</small><strong style="color:var(--amber)">3 mặt hàng</strong></div><div class="stat"><small>Cận hạn sử dụng</small><strong style="color:var(--red)">2 lô hàng</strong></div><div class="stat"><small>Hao hụt trong ca</small><strong style="color:var(--green)">1.8%</strong></div></div><div class="tablebox"><div class="tablehead"><div><h2>Kiểm kê nguyên vật liệu</h2><small style="color:var(--muted)">Chốt ca · 21/09/2026 · 15:30</small></div><button class="primary" onclick="stockModal()">＋ Nhập / chốt kho</button></div><table><thead><tr><th>SKU / Nguyên liệu</th><th>ĐVT</th><th>Đầu ca</th><th>Xuất pha chế</th><th>Thực tế cuối ca</th><th>Trạng thái</th></tr></thead><tbody>${stock.map(s=>`<tr><td><small style="color:#94a3b8">${s[0]}</small><br><strong>${s[1]}</strong></td><td>${s[2]}</td><td>${s[3]}</td><td>-${s[4]}</td><td><strong>${s[5]}</strong><br><small style="color:${s[5]<(s[3]-s[4])?'var(--red)':'var(--green)'}">${(s[5]-(s[3]-s[4])).toFixed(1)} lệch</small></td><td><span class="status ${s[6]==='Đủ hàng'?'ok':s[6]==='Sắp hết'?'low':'critical'}">${s[6]}</span></td></tr>`).join('')}</tbody></table></div></div></main>`}
function stockModal(){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><button class="modalclose" onclick="closeModal()">×</button><h2>Nhập kho / kiểm kê chốt ca</h2><label>SKU / Nguyên liệu<select><option>RM-003 · Hạt sen tươi</option><option>PK-001 · Ly nhựa Size S / M / L</option></select></label><label>Số lượng<input type="number" value="10"></label><label>Nhân viên phụ trách<input value="Nguyễn Minh Anh · Trưởng ca"></label><label>Ghi chú<textarea>Đối chiếu tồn thực tế cuối ca</textarea></label><button class="primary" style="width:100%" onclick="closeModal();toast('Đã lưu phiếu kiểm kê chốt ca')">Lưu phiếu</button></div></div>`}
function copyCode(code){navigator.clipboard?.writeText(code);toast('Đã sao chép mã '+code)}function updateCart(){document.getElementById('cartCount').textContent=cart.length}function closeModal(e){if(!e||e.target===e.currentTarget)document.getElementById('modalRoot').innerHTML=''}function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">✓　'+msg+'</div>';setTimeout(()=>r.innerHTML='',2600)}render();updateCart();
</script>
</body>
</html>
